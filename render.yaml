services:
  - type: web
    name: backend
    runtime: java
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/CryptoTrading-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: trading-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: trading-db
          property: password
      - key: PORT
        fromService:
          type: web
          property: port
      - key: STRIPE_API_KEY
        sync: false
      - key: RAZORPAY_API_KEY
        sync: false
      - key: RAZORPAY_API_SECRET
        sync: false
    databases:
      - name: trading-db
        databaseName: trading
        user: postgres
        plan: starter

  - type: web
    name: frontend
    runtime: static
    buildCommand: "npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_BASE_URL
        sync: false